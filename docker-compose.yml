version: '3'

services:
  backend:
    image: ./backend
    container_name: backend
    expose:
      - "5000"  # Internal API port
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"  # Expose port 80 to public
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html  # React static files
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
